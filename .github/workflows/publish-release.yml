name: Publish HACS release / Publicar versión HACS

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (example: v0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease / Marcar como preliminar'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: xpeng-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source or main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
          fetch-depth: 0
      - name: Validate version
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          test -s dist/xpeng-3d-card.js
          node --check dist/xpeng-3d-card.js
          VERSION="v${VERSION#v}"
          grep -Fq "XPeng 3D Card — ${VERSION#v}" dist/xpeng-3d-card.js || { echo "Source version differs from release version"; exit 1; }
      - name: Build distributable at repository root for HACS
        run: cp dist/xpeng-3d-card.js xpeng-3d-card.js
      - name: Create tag if needed and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRE: ${{ github.event_name == 'push' && 'true' || inputs.prerelease }}
        run: |
          VERSION="v${VERSION#v}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists / La versión ya está publicada"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          cat > release-notes.md <<'EOF'
          ## English
          - See CHANGELOG.md for changes in this version.
          - Built-in viewer is an early functional 3D prototype, not a manufacturer-accurate G6 model.
          - Read-only vehicle visualization; no control commands are sent.

          ## Español
          - Consulta CHANGELOG.md para conocer los cambios de esta versión.
          - El visor incluido es un prototipo 3D funcional, no una reproducción exacta del G6.
          - Visualización del coche en solo lectura; no se envían órdenes al vehículo.
          EOF
          if [ "$PRE" = "true" ]; then
            gh release create "$VERSION" xpeng-3d-card.js --title "$VERSION" --notes-file release-notes.md --prerelease --verify-tag
          else
            gh release create "$VERSION" xpeng-3d-card.js --title "$VERSION" --notes-file release-notes.md --verify-tag
          fi
